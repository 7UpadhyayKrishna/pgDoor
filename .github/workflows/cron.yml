name: Monthly commute refresh

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  commute:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/commute
        env:
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 900 \
            "${APP_URL%/}/api/cron/commute?secret=${CRON_SECRET}"
