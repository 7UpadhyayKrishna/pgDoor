services:
  db:
    image: postgres:16-alpine
    container_name: pgdoor-db
    environment:
      POSTGRES_USER: pgdoor
      POSTGRES_PASSWORD: pgdoor
      POSTGRES_DB: pgdoor
    ports:
      - "5432:5432"
    volumes:
      - pgdoor_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgdoor -d pgdoor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdoor_data:
